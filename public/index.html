<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Comercial</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div><h1>Sistema Comercial</h1><span id="nomeUsuario"></span></div><button id="btnSair">Sair</button></header>
<main class="container"><nav class="menu"><button class="menu-btn" data-tela="inicio">Início</button><button class="menu-btn" data-tela="clientes">Clientes</button><button class="menu-btn" data-tela="produtos">Produtos</button><button class="menu-btn" data-tela="pedidos">Pedidos</button><button class="menu-btn" data-tela="auditoria">Auditoria</button></nav><p id="mensagem" role="status" aria-live="polite"></p><section id="inicio" class="tela"><h2>Painel inicial</h2><div class="cards"><div class="card"><h3>Clientes cadastrados</h3><p id="totalClientes">—</p></div><div class="card"><h3>Produtos ativos em estoque</h3><p id="totalProdutos">—</p></div><div class="card"><h3>Faturamento do mês</h3><p id="faturamento">—</p></div></div></section><section id="clientes" class="tela escondido"><h2>Clientes</h2><form id="formCliente" class="formulario"><input type="hidden" id="idCliente"><label for="clienteNome">Nome</label><input id="clienteNome" type="text" required maxlength="120"><label for="clienteEmail">E-mail</label><input id="clienteEmail" type="email" required maxlength="150"><label for="clienteTelefone">Telefone</label><input id="clienteTelefone" type="text" maxlength="20"><label for="clienteDocumento">CPF/CNPJ</label><input id="clienteDocumento" type="text" required pattern="([0-9]{11}|[0-9]{14})" maxlength="14"><div class="acoes"><button type="submit">Salvar cliente</button><button type="button" id="limparCliente">Limpar</button></div></form><div class="tabela-container"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>CPF/CNPJ</th><th>Ações</th></tr></thead><tbody id="listaClientes"></tbody></table></div><div id="paginasClientes" class="acoes"></div></section><section id="produtos" class="tela escondido"><h2>Produtos</h2><form id="formProduto" class="formulario"><input type="hidden" id="idProduto"><input type="hidden" id="versaoProduto"><label for="produtoNome">Nome</label><input id="produtoNome" type="text" required maxlength="120"><label for="produtoDescricao">Descrição</label><input id="produtoDescricao" type="text" ><label for="produtoPreco">Preço</label><input id="produtoPreco" type="number" required min="0.01" max="99999999.99" step="0.01"><label for="produtoEstoque">Estoque</label><input id="produtoEstoque" type="number" required min="-2147483648" max="2147483647" step="1"><div class="acoes"><button type="submit">Salvar produto</button><button type="button" id="limparProduto">Limpar</button></div></form><div class="tabela-container"><table><thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="listaProdutos"></tbody></table></div><div id="paginasProdutos" class="acoes"></div></section><section id="pedidos" class="tela escondido"><h2>Pedidos</h2><form id="formPedido" class="formulario"><label for="pedidoCliente">Cliente</label><select id="pedidoCliente" required></select><label for="pedidoProduto">Produto</label><div class="linha-produto"><select id="pedidoProduto"></select><input id="pedidoQuantidade" type="number" min="1" step="1" value="1" aria-label="Quantidade"><button type="button" id="adicionarItem">Adicionar</button></div><ul id="itensSelecionados"></ul><p id="totalPedido"></p><button type="submit">Registrar pedido</button></form><div class="tabela-container"><table><thead><tr><th>Número</th><th>Cliente</th><th>Vendedor</th><th>Data</th><th>Status</th><th>Total</th><th>Ações</th></tr></thead><tbody id="listaPedidos"></tbody></table></div><div id="paginasPedidos" class="acoes"></div><div id="detalhesPedido" class="detalhes"></div></section>
<section id="auditoria" class="tela escondido"><h2>Auditoria</h2><div class="tabela-container"><table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody id="listaAuditoria"></tbody></table></div><div id="paginasAuditoria" class="acoes"></div></section></main><script src="/script.js"></script></body></html>
